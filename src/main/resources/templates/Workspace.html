<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>

    <!-- Load Blockly core -->
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <!-- Load the default blocks -->
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <!-- Load a message file -->
    <script src="https://unpkg.com/blockly/msg/en.js"></script>

    <style>
        * 
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #blocklyDiv 
        {
            height: 100vh;
            width: 100vw;
            position:fixed;
            top: 0;
            left: 0;
            border: 2px solid #6d6f70;
            margin: 0px;
        }

        body 
        {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 
        {
            color: #1b567e;
        }
    </style>
</head>
<body>
<div id="blocklyDiv"></div>

<!-- Load your custom script after the HTML is rendered -->
<script src="WorkspaceConfig/ThemesConfig.js"></script>
<script src="WorkspaceConfig/SetsConfig.js"></script>
<script src="WorkspaceConfig/ToolboxConfig.js"></script>
<script src="WorkspaceConfig/ApplyConfig.js"></script>
</body>
</html>
